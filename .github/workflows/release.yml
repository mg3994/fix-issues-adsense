name: Build and Release Theme

on:
  push:
    branches:
      - "*" # Trigger on pushes to all branches
  pull_request:
    branches:
      - "*" # Trigger on pull requests to all branches
  workflow_dispatch: # Allows manual triggering of the workflow

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'

      - name: Install dependencies
        run: dart pub get

      - name: Generate Blogger Theme XML
        run: dart run bin/generate.dart

      - name: Push into Releases Tab
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/blogger_theme.xml"
          tag: "v1.0.${{ github.run_number }}"
          name: "Blogger Theme Release v1.0.${{ github.run_number }}"
          body: "Automated modern Blogger theme release generated using blogger_theme Dart package. Ready for AdSense submission."
          token: ${{ secrets.GITHUB_TOKEN }}
